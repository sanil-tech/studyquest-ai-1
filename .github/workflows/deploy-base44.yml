name: Deploy to Base44

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-base44:
    name: Build & Deploy Serverless Engine
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Base44 CLI
        run: npm install -g @base44/cli

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Base44 Schema
        run: base44 validate
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_SERVICE_ROLE_KEY }}

      - name: Deploy Base44 Environment
        run: base44 deploy --auto-confirm
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post-Deployment Smoke Test
        run: npm run test:smoke-live
        continue-on-error: true
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_SERVICE_ROLE_KEY }}
